version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gala_ph_postgres
    restart: always
    environment:
      POSTGRES_USER: gala_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: gala_ph_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gala_user -d gala_ph_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gala_ph_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
